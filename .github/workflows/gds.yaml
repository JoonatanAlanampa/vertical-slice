name: gds

on:
  push:
  workflow_dispatch:

jobs:
  gds:
    runs-on: ubuntu-24.04
    steps:
      - name: checkout repo
        uses: actions/checkout@v6
        with:
          submodules: recursive

      # The submitted GDS is built from the repository, so the cell library has
      # to BE in the repository and has to be the pinned one. Offline check.
      - name: Verify the committed cell library against lib.lock
        run: python tools/verify_lib.py

      - name: Build GDS
        uses: TinyTapeout/tt-gds-action@ttsky26c
        with:
          pdk: sky130A

      # The audit that matters most, and the one whose ABSENCE here was the
      # whole of blocker 1: until 2026-07-25 the zero-foundry check ran only in
      # harden.yml, on a build that was never submitted, while THIS path — the
      # one TinyTapeout actually takes — quietly produced a foundry-cell chip
      # and went green. Never let the submission path ship unaudited again.
      # `if:` is load-bearing. Without it GitHub skips this step whenever
      # Build GDS fails — and Build GDS has failed on every run since
      # 2026-07-25 for an unrelated upstream reason, so blocker 1's guard was
      # silently inert for eleven days on the very path it protects. The flow
      # completes all 68 steps and writes the netlist before that failure.
      - name: Zero-foundry audit of the SUBMITTED netlist
        if: success() || failure()
        run: |
          python3 - << 'EOF'
          import glob, re, sys
          pats = ["runs/*/final/nl/*.nl.v", "runs/*/final/pnl/*.pnl.v",
                  "tt_submission/**/*.nl.v"]
          nl = sorted({p for pat in pats for p in glob.glob(pat, recursive=True)})
          if not nl:
              # Fail loudly rather than pass vacuously: a check that cannot find
              # its input is not a passing check.
              print("searched:", *pats, sep="\n  ")
              print("tree:", *sorted(glob.glob("runs/*/final/*"))[:20], sep="\n  ")
              sys.exit("no final netlist found — cannot audit what ships")
          bad = False
          for f in nl:
              hits = sorted(set(re.findall(r"\bsky130_\w+", open(f).read())))
              print(f"{f}: {'FOUNDRY CELLS ' + ', '.join(hits) if hits else 'clean'}")
              bad |= bool(hits)
          if bad:
              sys.exit("zero-foundry claim broken in the SUBMITTED netlist — "
                       "see PLAN.md and research/vertical-slice-presubmit-codex.md")
          print("zero-foundry: OK on the submitted netlist")
          EOF

      # ...and the same claim against the artifact that is actually fabricated.
      # Review-brief Q8: the step above audits the NETLIST, which is neither
      # what the foundry receives nor the property we care about. Fill, tap,
      # decap, diode and CTS cells enter at the PHYSICAL level, so the GDS is
      # where "zero foundry content" is either true or not. They agree today
      # (15 structures: our 14 cells + the top) — assert it, do not assume it.
      - name: Zero-foundry audit of the FABRICATED GDS
        if: success() || failure()
        run: python3 tools/audit_gds.py

      # Blocker 2 was "no top-level connectivity signoff on the all-own GDS".
      # It is actually there and it passes — netgen LVS with `-blackbox`
      # comparing the magic-extracted GDS against the post-P&R netlist, which
      # is precisely the check cell-level LVS in stdcells cannot do. What was
      # missing was anybody READING it: the verdict sat in a 984-file log
      # artifact behind a red badge. So read it here, every run, and fail on a
      # regression. Runs even when Build GDS failed, because the flow completes
      # all 68 steps before the upstream summary `cat` kills the step.
      - name: Signoff numbers of the submitted run (LVS / DRC / antenna)
        if: success() || failure()
        run: python3 tools/check_signoff.py runs

      # Fanout-aware audit of the netlist that ships. The zero-foundry check
      # above counts cell TYPES and the ring check counts INSTANCE NAMES;
      # neither can see a load, which is how 93 buffers came to sit on the
      # ring-oscillator nodes this chip exists to measure (READINESS.md H3).
      - name: Connectivity audit of the committed netlist
        if: success() || failure()
        run: python3 tools/audit_netlist.py harden/vslice_gates.v

      # The one above audits what synthesis produced. THIS audits what P&R
      # produced, and it is the one that actually protects the measurement:
      # ring delay is set by the routed result, and P&R inserts ~155 buffers
      # (CTS, hold repair, max-cap repair) that synthesis never saw. Measured
      # on run 30752441492 — none of them lands on a ring node — but "none
      # this time" is not a property, so assert it on every run.
      - name: Connectivity audit of the ROUTED netlist
        if: success() || failure()
        run: |
          set -e
          shopt -s nullglob
          nl=(runs/*/final/nl/*.nl.v)
          if [ ${#nl[@]} -eq 0 ]; then
            echo "no routed netlist found — cannot audit what P&R produced"; exit 1
          fi
          for f in "${nl[@]}"; do
            echo "=== $f ==="
            python3 tools/audit_netlist.py "$f"
          done

      # Was only ever run in harden.yml, i.e. against the bare die that is
      # never submitted — the same "guard on the wrong artifact" shape as
      # blocker 1. It also used to compare SDF file BYTES, which passes when
      # the files differ only in their VOLTAGE/TEMPERATURE header. Both fixed;
      # this now runs on the chip that ships and compares delay content.
      - name: Timing corners really differ (submitted run)
        if: success() || failure()
        run: python3 flow/check_corner_spread.py runs

      # M19. librelane emits NO min-pulse-width metric -- verified by listing
      # every key of a real final/metrics.json -- so there was nothing to add
      # to check_signoff.py's MUST_BE_ZERO list and the check has to be RUN.
      # It matters on this die and not in general: the ring-oscillator
      # prescaler is clocked DIRECTLY by the ring, so ro_clk's half period is
      # a real clock pulse at a real flop, and it is the fastest clock here by
      # two orders of magnitude (679 ps at ff against clk's 10 ns). A flop
      # that cannot capture on it gives a counter that does not count -- the
      # one number this chip exists to measure, wrong without being zero.
      # The script reads harden/signoff.sdc, NOT the run's final/sdc: ro_clk
      # is deliberately kept out of the PNR constraints (CTS would build a
      # clock tree on a ring oscillator), so the PNR sdc would have let this
      # pass while never looking at the ring at all.
      # It carries its own positive control -- inflating the requirement to
      # 9 ns must flag the ring flops -- because "0 violations" is the exact
      # shape of the four checks this repo has already caught not looking.
      - name: Clock pulses meet the library's min_pulse_width (M19)
        if: success() || failure()
        run: python3 flow/check_min_pulse_width.py runs

      # M21. docs/info.md publishes what each ring should do in silicon, per
      # PVT corner -- the numbers a person holds the first chip against in
      # 2027, with no way to re-derive them once the die is in hand. They were
      # regenerated BY HAND (last at 5ded3aa) and ring_prediction.py appeared
      # nowhere in these workflows, so they aged out silently: the committed
      # table said run 30934157150 / lib-v1.4, and by 2026-08-21 every headline
      # cell disagreed with the design that ships (NOR2 worst, 291.9 -> 289.5
      # MHz and 187 -> 185 counts at tt). Ring period is set by the ROUTED
      # result -- the lesson of H3 and M7 -- so a table computed from a
      # different routed netlist is not a prediction about this chip.
      # Every other claim here is asserted on every run. Now this one is too.
      - name: Published ring predictions match this design (M21)
        if: success() || failure()
        run: python3 flow/check_ring_doc.py runs

      # Same reason as harden.yml (defect M31): tt-gds-action's own artifact is
      # built from a COMPLETED run, so a flow that dies in place-and-route
      # leaves nothing to read. These are logs and reports only.
      - name: Upload run logs when anything above FAILED
        if: failure()
        run: sudo chown -R "$USER" runs || true
      - name: Upload run logs (failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gds-run-logs
          path: |
            runs/**/*.log
            runs/**/*.rpt
            runs/**/reports/**
            runs/**/*.json
          if-no-files-found: warn
          retention-days: 14

  # The ring read-out path, simulated on the netlist that actually ships.
  #
  # WHY THIS JOB EXISTS. TinyTapeout's own `gl_test` runs the netlist at ZERO
  # delay, which turns a ring oscillator into a combinational loop, so every
  # ring test skips itself there: at 19aef52 that job reported TESTS=8 PASS=3
  # SKIP=5. The consequence was that on the artifact being fabricated, the only
  # functionally verified behaviour was the sine engine and "a dark ring reads
  # zero" -- the prescaler, the CDC synchronizer, the window accumulator, the
  # count latch, the byte mux and the arm latch were all unverified post-route.
  # test/run_gl_own.py exists precisely to close that (it back-annotates the
  # post-P&R SDF so the rings really oscillate) and it was in NO workflow; its
  # last recorded run was 2026-07-21, against a pre-H3 netlist that no longer
  # exists. Measured locally on this artifact: 5/5 pass in 32 seconds.
  #
  # ⚠️ WHAT IT DOES AND DOES NOT PROVE. It proves the instrument WORKS on the
  # routed netlist -- that the counter counts, the mux addresses the latched
  # value, and selection is latched at arm. It does NOT validate the published
  # silicon prediction: the simulation is annotated from the same SDF the raw
  # prediction is summed from, so those two agree by construction. The
  # corrected prediction in docs/info.md is a correction TO that SDF, and only
  # the die can settle it.
  gl_rings:
    needs: gds
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - name: Install iverilog
        run: sudo apt-get update && sudo apt-get install -y iverilog
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - run: pip install -r test/requirements.txt
      - name: Fetch the hardening run
        uses: actions/download-artifact@v5
        with:
          name: GDS_logs
          path: gdslogs
      # No `if: failure()` escape and no `continue-on-error`: a ring read-out
      # that cannot be simulated is a finding, not a warning.
      - name: Rings count on the routed netlist (SDF back-annotated)
        run: python3 test/run_gl_own.py gdslogs/runs

  precheck:
    needs: gds
    runs-on: ubuntu-24.04
    steps:
      - name: Run Tiny Tapeout Precheck
        uses: TinyTapeout/tt-gds-action/precheck@ttsky26c

  gl_test:
    needs: gds
    runs-on: ubuntu-24.04
    steps:
      - name: checkout repo
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: GL test
        uses: TinyTapeout/tt-gds-action/gl_test@ttsky26c

  viewer:
    needs: gds
    runs-on: ubuntu-24.04
    permissions:
      pages: write      # to deploy to Pages
      id-token: write   # to verify the deployment originates from an appropriate source
    steps:
      - uses: TinyTapeout/tt-gds-action/viewer@ttsky26c
